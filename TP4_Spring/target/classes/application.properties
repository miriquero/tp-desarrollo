spring.application.name=TP4_Spring

# Conexion a BD
spring.datasource.url=jdbc:mariadb://127.0.0.1:3306/facturacion_arca?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Configuracion de JPA/Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# Conserva los nombres de columnas del proyecto JPA anterior (por ejemplo, puntoVenta_id).
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
